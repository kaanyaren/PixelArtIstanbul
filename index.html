<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelArtIstanbul — Darphane</title>
<style>
  html, body { margin: 0; background: #1a1c22; color: #eee; font-family: monospace; }
  #game canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  #hud { text-align: center; font-size: 12px; padding: 6px; }
  #select { text-align: center; padding: 8px; }
  #select button { font-family: monospace; margin: 0 6px; padding: 8px 12px; cursor: pointer; }
</style>
<script type="importmap">
{
  "imports": {
    "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.js"
  }
}
</script>
</head>
<body>
<div id="select">
  <span>Choose walker:</span>
  <button data-tint="0x4dc26b">Green</button>
  <button data-tint="0x4d8ac2">Blue</button>
  <button data-tint="0xc25d4d">Red</button>
  <span>WASD / Arrows to move</span>
</div>
<div id="game"></div>
<div id="hud">© OpenStreetMap contributors ODbL</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
