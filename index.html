<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 8 L8 4 L16 8 L16 12 L8 16 L0 12 Z' fill='%23B5432F'/%3E%3C/svg%3E" />
<title>Fractal Darphane — walkable Istanbul</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F5DFB8; color: #5A4632; font-family: monospace; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  #select { flex: 0 0 auto; }
  #game { flex: 1 1 auto; position: relative; min-height: 0; }
  #game canvas { image-rendering: pixelated; display: block; margin: 0; width: 100% !important; height: 100% !important; }
  #hud { flex: 0 0 auto; text-align: center; font-size: 12px; padding: 6px; color: #5A4632; }
  #select { text-align: center; padding: 8px; color: #5A4632; }
  #select button {
    font-family: monospace; margin: 0 6px; padding: 8px 14px; cursor: pointer;
    background: #FFEDCB; color: #5A4632; border: 2px solid #C9A86A; border-radius: 10px;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  #select button:hover { background: #FFE3AC; }
  .walker-btn.active, .tod-btn.active { background: #5A4632 !important; color: #FFEDCB !important; font-weight: bold; border-color: #3e2f22 !important; }
  #touch-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 50;
    display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px);
    gap: 4px; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #touch-ui button {
    font-family: monospace; font-size: 18px; cursor: pointer;
    background: rgba(255,237,203,0.92); color: #5A4632;
    border: 2px solid #C9A86A; border-radius: 10px; touch-action: none;
  }
  #touch-ui button:active { background: #FFE3AC; }
  #zoom-ui {
    position: fixed; right: 12px; top: 64px; z-index: 50;
    display: flex; flex-direction: column; gap: 6px;
    user-select: none; -webkit-user-select: none;
  }
  #zoom-ui button {
    width: 44px; height: 44px; font-family: monospace; font-size: 20px; cursor: pointer;
    background: rgba(255,237,203,0.92); color: #5A4632;
    border: 2px solid #C9A86A; border-radius: 10px;
  }
  #zoom-ui button:active { background: #FFE3AC; }
  .settings-panel { background:#FFEDCB; color:#5A4632; border:2px solid #C9A86A; border-radius:12px; max-width:460px; margin:0 auto; padding:16px; font-family:monospace; max-height:85vh; overflow:auto; }
  .settings-panel h2 { margin:0 0 12px; font-size:16px; }
  .set-row { display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; padding:8px 0; border-bottom:1px dashed #E0C79A; }
  .set-row label { font-size:13px; }
  .set-val { font-size:12px; opacity:0.85; }
  .set-row input[type=range] { grid-column:1/-1; width:100%; accent-color:#B5432F; }
  .set-row select { grid-column:2; font-family:monospace; padding:4px; background:#FFF7E4; border:2px solid #C9A86A; border-radius:8px; color:#5A4632; }
  .set-row input[type=checkbox] { width:18px; height:18px; accent-color:#B5432F; }
  .settings-footer { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:flex-end; }
  .settings-footer button { font-family:monospace; padding:8px 14px; cursor:pointer; background:#FFEDCB; color:#5A4632; border:2px solid #C9A86A; border-radius:10px; }
  .settings-footer button:hover { background:#FFE3AC; }
  #settings-apply { background:#5A4632; color:#FFEDCB; }
  .settings-footer button:disabled { opacity:0.5; cursor:default; }
</style>
<script type="importmap">
{
  "imports": {
    "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.js"
  }
}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="select">
  <span>Choose walker:</span>
  <button class="walker-btn active" data-tint="0x4dc26b">🟢 Green</button>
  <button class="walker-btn" data-tint="0x4d8ac2">🔵 Blue</button>
  <button class="walker-btn" data-tint="0xc25d4d">🔴 Red</button>
  <span style="margin:0 4px 0 8px;opacity:0.5;">|</span>
  <button class="tod-btn" data-tod="day">☀️ Day</button>
  <button class="tod-btn" data-tod="golden">🌅 Golden</button>
  <button class="tod-btn" data-tod="night">🌙 Night</button>
  <span>WASD / Arrows to move</span>
  <button id="change-area">📍 Change area</button>
  <button id="settings-open" aria-label="Settings">⚙️ Settings</button>
</div>
<div id="game"></div>
<div id="zoom-ui">
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="zoom-out" aria-label="Zoom out">−</button>
</div>
<div id="touch-ui">
  <span></span><button id="dpad-up" aria-label="Up">▲</button><span></span>
  <button id="dpad-left" aria-label="Left">◀</button><span></span><button id="dpad-right" aria-label="Right">▶</button>
  <span></span><button id="dpad-down" aria-label="Down">▼</button><span></span>
</div>
<div id="hud">© OpenStreetMap contributors ODbL · Buildings: Microsoft</div>
<div id="area-modal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(90,70,50,0.55);padding:4vh 4vw;box-sizing:border-box;">
  <div style="background:#FFEDCB;border:2px solid #C9A86A;border-radius:12px;max-width:640px;margin:0 auto;padding:12px;color:#5A4632;font-family:monospace;">
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <input id="area-search-input" type="text" placeholder="Search street, avenue, or address (e.g. Rami Kışla Caddesi)" style="flex:1;padding:8px 10px;font-family:monospace;background:#FFF7E4;border:2px solid #C9A86A;border-radius:8px;color:#5A4632;" />
      <button id="area-search-btn" style="font-family:monospace;padding:8px 14px;cursor:pointer;background:#5A4632;color:#FFEDCB;border:2px solid #C9A86A;border-radius:8px;">Search</button>
    </div>
    <div id="area-search-status" style="font-size:11px;opacity:0.8;margin-bottom:6px;">Type any street, avenue or neighborhood in Istanbul and press Search</div>
    <div id="area-map" style="height:60vh;width:100%;border:2px solid #C9A86A;border-radius:8px;"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <button id="area-play" style="font-family:monospace;padding:8px 14px;cursor:pointer;background:#5A4632;color:#FFEDCB;border:2px solid #C9A86A;border-radius:10px;">Play this area</button>
      <button id="area-cancel" style="font-family:monospace;padding:8px 14px;cursor:pointer;background:#FFEDCB;color:#5A4632;border:2px solid #C9A86A;border-radius:10px;">Cancel</button>
      <button id="area-home" style="font-family:monospace;padding:8px 14px;cursor:pointer;background:#FFEDCB;color:#5A4632;border:2px solid #C9A86A;border-radius:10px;">Back to Darphane</button>
    </div>
  </div>
</div>
<div id="area-loading" style="display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:101;background:#5A4632;color:#FFEDCB;font-family:monospace;padding:8px 16px;border-radius:10px;border:2px solid #C9A86A;">Loading streets…</div>
<div id="area-err" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:101;background:#7a2e22;color:#FFEDCB;font-family:monospace;padding:8px 16px;border-radius:10px;border:2px solid #C9A86A;"></div>
<div id="settings-modal" style="display:none;position:fixed;inset:0;z-index:110;background:rgba(90,70,50,0.55);padding:6vh 4vw;box-sizing:border-box;">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <div id="settings-rows"></div>
    <div class="settings-note" id="settings-reload-note" style="display:none;font-size:11px;opacity:0.8;">Area radius and street life apply after reload.</div>
    <div class="settings-footer">
      <button id="settings-apply">Apply</button>
      <button id="settings-reset">Reset</button>
      <button id="settings-reload" style="display:none">Reload now</button>
      <button id="settings-close">Done</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
